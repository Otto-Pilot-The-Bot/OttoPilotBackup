<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Otto Pilot's World</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script>
<link rel="stylesheet" href="/style.css">
</head><body>
<header id="top">
  <div id="stats" class="pill dashed">
    <div id="meters"></div>
    <div class="sx mood" title="Mood"><span class="dot" style="--c:#e87aa0"></span><span class="lbl" id="moodChip">waking up</span></div>
    <div class="sx money" id="money" title="Otto's money (pocket + bank)" hidden><span class="dot" style="--c:#e8b13a"></span><span class="lbl" id="moneyVal">$0.00</span></div>
  </div>
  <div id="meta">
    <div id="clock" class="pill blue clock" title="In-world time"><span id="clockIcon">☀️</span> <span id="clockText">--:--</span></div>
    <div class="pill who"><span id="moodEmoji" class="avatar">🤖</span><b id="name">…</b></div>
    <div id="wx" class="pill" title="Weather and season"></div>
  </div>
</header>
<nav id="menu"></nav>
<section id="panel" class="paper" hidden>
  <header><h2 id="panelTitle"></h2><button id="panelClose" class="x" aria-label="Close panel">✕</button></header>
  <div id="panelBody"></div>
</section>
<div id="caption" class="paper"><span id="capIcon">💭</span><span id="capText">Waking up…</span></div>
<div id="toast" class="paper" hidden></div>
<div id="conn" class="paper" hidden></div>
<div id="lightbox" hidden><div class="box paper"><button class="x" id="lbClose" aria-label="Close">✕</button><div id="lbBody"></div></div></div>
<script type="module" src="/main.js"></script>
</body></html>
